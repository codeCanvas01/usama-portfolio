<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a3d" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b2b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- 1. Background Badge -->
  <rect x="20" y="20" width="984" height="984" rx="220" fill="#0b0c10" />
  <rect x="28" y="28" width="968" height="968" rx="212" fill="none" stroke="url(#badgeGlow)" stroke-width="24" stroke-opacity="0.85" />

  <!-- 2. Shopping Bag Handle -->
  <path
    d="M 360 330 A 152 152 0 0 1 664 330"
    fill="none"
    stroke="url(#orangeGrad)"
    stroke-width="52"
    stroke-linecap="round"
  />

  <!-- 3. Shopping Bag Body -->
  <polygon
    points="248,360 776,360 740,810 284,810"
    fill="#12141c"
    stroke="#f1f3f7"
    stroke-width="36"
    stroke-linejoin="round"
  />

  <!-- 4. Code Brackets < / > -->
  <!-- Left Bracket < -->
  <path
    d="M 415 490 L 325 580 L 415 670"
    fill="none"
    stroke="url(#orangeGrad)"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Slash / -->
  <line
    x1="545"
    y1="470"
    x2="479"
    y2="690"
    stroke="#ffffff"
    stroke-width="36"
    stroke-linecap="round"
  />

  <!-- Right Bracket > -->
  <path
    d="M 609 490 L 699 580 L 609 670"
    fill="none"
    stroke="url(#orangeGrad)"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
